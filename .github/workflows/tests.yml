name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit / Integration (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout requests websocket-client

      - name: Run offline tests (FakeProvider / unit / integration)
        run: |
          python -m pytest tests/ -q --tb=short --timeout=120 -p no:cacheprovider

  full-suite:
    name: Full suite incl. slow E2E (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout requests websocket-client

      - name: Run full test suite
        run: |
          python -m pytest tests/ -q --tb=short --timeout=300 -p no:cacheprovider